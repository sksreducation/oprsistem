<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator OPR SK Simpang Rawai</title>
  <style>
    :root {
      --primary-color: #0d6efd;
      --bg-color: #f8f9fa;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 15px;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      max-width: 600px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      color: #1a252f;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      font-weight: 600;
      display: block;
      margin-bottom: 5px;
      font-size: 0.9em;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1em;
    }
    textarea {
      height: 80px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-ai { background-color: #6f42c1; color: white; }
    .btn-submit { background-color: #198754; color: white; }
    .btn-print { background-color: #0d6efd; color: white; }
    .btn:disabled { opacity: 0.6; }
    .preview-box {
      margin-top: 20px;
      border-top: 2px dashed #ccc;
      padding-top: 20px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>📋 Generator OPR (Mobile)</h2>
  
  <form id="oprForm">
    <div class="form-group">
      <label>Tajuk Program:</label>
      <input type="text" id="tajuk" value="PROGRAM SAFE 'KAMU BULI POLIS TANGKAP'" required>
    </div>
    
    <div class="form-group">
      <label>Unit Anjuran:</label>
      <input type="text" id="unit" value="Unit Hal Ehwal Murid (HEM)">
    </div>

    <div class="form-group">
      <label>Tarikh:</label>
      <input type="text" id="tarikh" value="Khamis (5/11/2026)">
    </div>

    <div class="form-group">
      <label>Masa:</label>
      <input type="text" id="masa" value="11.00 pagi - 12.30 tengah hari">
    </div>

    <div class="form-group">
      <label>Tempat:</label>
      <input type="text" id="tempat" value="Dewan Al Jazari">
    </div>

    <div class="form-group">
      <label>Sasaran:</label>
      <input type="text" id="sasaran" value="Murid Tahap 2">
    </div>

    <div class="form-group">
      <label>Jemputan / Penceramah:</label>
      <input type="text" id="jemputan" value="ASP Tuan Othman bin Ibrahim">
    </div>

    <button type="button" class="btn btn-ai" onclick="generateAI()">✨ AI Generate Objektif & Impak</button>

    <div class="form-group" style="margin-top: 15px;">
      <label>Objektif Program:</label>
      <textarea id="objektif">1. Memberi kesedaran dan pendedahan awal mengenai bahaya serta implikasi kes buli di sekolah.
2. Memupuk disiplin dan kesedaran undang-undang dalam kalangan murid Tahap 2.
3. Mengeratkan kerjasama antara pihak sekolah dan PDRM.</textarea>
    </div>

    <div class="form-group">
      <label>Impak Program:</label>
      <textarea id="impak">Murid mendapat pendedahan jelas tentang akibat perbuatan buli dari sudut undang-undang dan disiplin serta mewujudkan persekitaran sekolah yang selamat.</textarea>
    </div>

    <button type="button" class="btn btn-submit" id="btnSimpan" onclick="simpanKeSheets()">💾 Simpan Rekod ke Google Sheets</button>
    <button type="button" class="btn btn-print" onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
  </form>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw4OaJI6jVZZs_5ZxpN--k70llIjD1KTA_tNnnpfGkN8NRlGbQRsplJcuGI5N47zFjVHg/exec";

  function generateAI() {
    const tajuk = document.getElementById("tajuk").value;
    const sasaran = document.getElementById("sasaran").value;

    if (!tajuk) {
      alert("Sila isi Tajuk Program terlebih dahulu.");
      return;
    }

    // AI Fallback Generator Pintar
    let obj1 = `Memberi kesedaran dan pemahaman mendalam berkaitan ${tajuk} kepada ${sasaran}.`;
    let obj2 = `Memupuk nilai murni, disiplin dan sikap bertanggungjawab dalam kalangan ${sasaran}.`;
    let obj3 = `Mewujudkan persekitaran sekolah yang selamat, kondusif dan harmoni.`;
    
    let impakRes = `Program ini berjaya meningkatkan tahap kesedaran ${sasaran} serta memberi impak positif terhadap pembentukan sahsiah diri murid.`;

    document.getElementById("objektif").value = `1. ${obj1}\n2. ${obj2}\n3. ${obj3}`;
    document.getElementById("impak").value = impakRes;
    
    alert("Objektif dan Impak berjaya dijana oleh AI!");
  }

  async function simpanKeSheets() {
    const btn = document.getElementById("btnSimpan");
    btn.disabled = true;
    btn.innerText = "⏳ Memproses simpanan...";

    const payload = {
      tajuk: document.getElementById("tajuk").value,
      unit: document.getElementById("unit").value,
      tarikh: document.getElementById("tarikh").value,
      masa: document.getElementById("masa").value,
      tempat: document.getElementById("tempat").value,
      sasaran: document.getElementById("sasaran").value,
      jemputan: document.getElementById("jemputan").value,
      objektif: document.getElementById("objektif").value,
      impak: document.getElementById("impak").value
    };

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      alert("Data berjaya dihantar ke Google Sheets!");
    } catch (e) {
      alert("Ralat menghantar data: " + e.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "💾 Simpan Rekod ke Google Sheets";
    }
  }
</script>
</body>
</html>
