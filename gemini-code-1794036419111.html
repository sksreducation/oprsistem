<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator OPR SK Simpang Rawai</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; padding: 15px; margin: 0; }
    .card { background: #fff; padding: 20px; border-radius: 12px; max-width: 650px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1a252f; margin-top: 0; }
    .form-group { margin-bottom: 12px; }
    label { font-weight: bold; display: block; margin-bottom: 4px; font-size: 0.9em; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1em; }
    textarea { height: 85px; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 1em; }
    .btn-ai { background: #6f42c1; color: white; }
    .btn-submit { background: #198754; color: white; }
    .btn-print { background: #0d6efd; color: white; }
    .btn:disabled { opacity: 0.5; }
    .sheet-container { margin-top: 25px; border-top: 2px dashed #ccc; padding-top: 15px; }
    iframe { width: 100%; height: 400px; border: 1px solid #ddd; border-radius: 8px; }
  </style>
</head>
<body>

<div class="card">
  <h2>📋 Generator OPR Mobile</h2>
  <form id="oprForm">
    <div class="form-group"><label>Tajuk Program:</label><input type="text" id="tajuk" value="PROGRAM SAFE 'KAMU BULI POLIS TANGKAP'"></div>
    <div class="form-group"><label>Unit Anjuran:</label><input type="text" id="unit" value="Unit Hal Ehwal Murid (HEM)"></div>
    <div class="form-group"><label>Tarikh:</label><input type="text" id="tarikh" value="Khamis (5/11/2026)"></div>
    <div class="form-group"><label>Masa:</label><input type="text" id="masa" value="11.00 pagi - 12.30 tengah hari"></div>
    <div class="form-group"><label>Tempat:</label><input type="text" id="tempat" value="Dewan Al Jazari"></div>
    <div class="form-group"><label>Sasaran:</label><input type="text" id="sasaran" value="Murid Tahap 2"></div>
    <div class="form-group"><label>Jemputan:</label><input type="text" id="jemputan" value="ASP Tuan Othman bin Ibrahim"></div>

    <button type="button" class="btn btn-ai" onclick="generateAI()">✨ AI Generate Objektif & Impak</button>

    <div class="form-group" style="margin-top:10px;"><label>Objektif:</label><textarea id="objektif">1. Memberi kesedaran dan pendedahan awal mengenai bahaya serta implikasi kes buli di sekolah.
2. Memupuk disiplin dan kesedaran undang-undang dalam kalangan murid Tahap 2.
3. Mengeratkan kerjasama antara pihak sekolah dan PDRM.</textarea></div>

    <div class="form-group"><label>Impak:</label><textarea id="impak">Murid mendapat pendedahan jelas tentang akibat perbuatan buli dari sudut undang-undang dan disiplin serta mewujudkan persekitaran sekolah yang selamat.</textarea></div>

    <div class="form-group">
      <label>Gambar Aktiviti (Maksimum 4):</label>
      <input type="file" id="gambarInput" accept="image/*" multiple onchange="processImages()">
      <div id="preview" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;"></div>
    </div>

    <button type="button" class="btn btn-submit" id="btnSimpan" onclick="simpanKeSheets()">💾 Simpan ke Google Drive & Sheets</button>
    <button type="button" class="btn btn-print" onclick="window.print()">🖨️ Cetak / PDF</button>
  </form>

  <div class="sheet-container">
    <h3>📊 Rekod Laporan OPR (Live Sheet)</h3>
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS_dLChN5Jo22s1_7vKcJQq-Kr2wdmcL0aS28fARoirj3VHAk8eGcra3Rlm6hSN4Ssv_Lq0SoZSiXUT/pubhtml?gid=0&amp;single=true&amp;widget=true&amp;headers=false"></iframe>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1-5wokDewD3Dq8qq4138XI8NCOYEfsAxxFcB5bVOPpKXV_TxWMetlGqUOgAvlowHp/exec";
  let compressedImages = [];

  function processImages() {
    const files = Array.from(document.getElementById('gambarInput').files).slice(0, 4);
    const container = document.getElementById('preview');
    container.innerHTML = '';
    compressedImages = [];

    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 800;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const base64Res = canvas.toDataURL('image/jpeg', 0.7);
          compressedImages.push(base64Res);

          const previewImg = document.createElement('img');
          previewImg.src = base64Res;
          previewImg.style.width = '100%';
          previewImg.style.height = '90px';
          previewImg.style.objectFit = 'cover';
          previewImg.style.borderRadius = '6px';
          container.appendChild(previewImg);
        };
      };
      reader.readAsDataURL(file);
    });
  }

  function generateAI() {
    const tajuk = document.getElementById("tajuk").value;
    const sasaran = document.getElementById("sasaran").value;
    if (!tajuk) return alert("Sila isi Tajuk Program.");

    document.getElementById("objektif").value = `1. Memberi kesedaran mendalam tentang ${tajuk} kepada ${sasaran}.\n2. Memupuk sahsiah dan disiplin terpuji.\n3. Mewujudkan suasana sekolah yang harmoni dan selamat.`;
    document.getElementById("impak").value = `Program ini berjaya meningkatkan kesedaran ${sasaran} dan memperkasakan amalan disiplin di sekolah.`;
    alert("Objektif & Impak berjaya dijana oleh AI!");
  }

  async function simpanKeSheets() {
    const btn = document.getElementById("btnSimpan");
    btn.disabled = true;
    btn.innerText = "⏳ Memproses & Menghantar...";

    const payload = {
      tajuk: document.getElementById("tajuk").value,
      unit: document.getElementById("unit").value,
      tarikh: document.getElementById("tarikh").value,
      masa: document.getElementById("masa").value,
      tempat: document.getElementById("tempat").value,
      sasaran: document.getElementById("sasaran").value,
      jemputan: document.getElementById("jemputan").value,
      objektif: document.getElementById("objektif").value,
      impak: document.getElementById("impak").value,
      gambarList: compressedImages
    };

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      alert("✅ Data & Gambar berjaya dihantar ke Google Drive & Sheets!");
    } catch (e) {
      alert("❌ Ralat: " + e.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "💾 Simpan ke Google Drive & Sheets";
    }
  }
</script>
</body>
</html>
